[tools]
# Exact, like the crates the parity claims rest on. Every committed Fixture carries the version it
# was recorded under, and a harvest run on any other one rewrites that field in all nineteen — so a
# loose pin turns `drift` into noise the first time a minor lands.
node = "24.20.0"

hk = "latest"
pkl = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.build]
description = "Build the project."
run = "cargo build --workspace --release"

[tasks.fmt]
description = "Format."
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Fail if anything is unformatted."
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy over everything, tests and examples included, warnings fatal."
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "The whole suite."
run = "cargo test --workspace"

[tasks.upstream]
description = "Put clack at the pinned tag in upstream/, installed and built."
# What every harvest needs and nothing else does. `upstream/` is not committed (ADR-0008), so this
# is the one command between a fresh clone and a recording. The tag lives in scripts/upstream.mjs,
# which is also what refuses to record from anything else.
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
tag=$(node -e 'import("./scripts/upstream.mjs").then(m => console.log(m.TAG))')

if [ -d upstream/clack/.git ]; then
	git -C upstream/clack fetch --tags --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
else
	mkdir -p upstream
	# Shallow, and only the one tag: nothing here reads clack's history, only one commit of it.
	git clone --depth 1 --branch "$tag" https://github.com/bombshell-dev/clack upstream/clack
fi
git -C upstream/clack checkout --quiet "$tag"

# Through corepack, and from inside the checkout, so the pnpm that reads clack's lockfile is the
# one clack pins in its own `packageManager` field. An ambient pnpm is a second, unpinned tool in a
# project that pins everything else exactly: pnpm 11 defaults `autoInstallPeers` to true, the
# lockfile records false, and `--frozen-lockfile` refuses. Same reasoning as the node pin above,
# except the version is upstream's to choose and moves with the tag, so it is read, never copied.
(
	cd upstream/clack
	corepack pnpm install --frozen-lockfile
	# The Emitter's oracle is the built `Prompt` class, not its source.
	corepack pnpm --filter @clack/core build
)

echo
# By the tag, not by `git describe` — the monorepo puts several tags on one commit, so `describe`
# answers `@clack/core@1.4.3` here and reads like the wrong checkout.
echo "upstream/clack is at $tag ($(git -C upstream/clack rev-parse --short HEAD))."
'''

[tasks.drift]
description = "Re-record every Fixture against pinned clack and report what moved."
# Deliberate, never CI: it needs the checkout `mise run upstream` makes, which is not committed. The
# harvests refuse rather than guess if that checkout is at the wrong tag, so this is safe to run
# blind. What it reports is that a recording is stale — not that the port is wrong. See ADR-0003.
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
fixtures=crates/clark-core/tests/fixtures

# The committed Fixtures are the baseline, so they have to be the baseline. Recording over an
# already-dirty tree answers a different question than the one being asked.
if [ -n "$(git status --porcelain -- $fixtures)" ]; then
	echo "drift: $fixtures is not clean. Commit or stash it first." >&2
	git status --short -- $fixtures >&2
	exit 2
fi

for fixture in crates/clark-core/tests/fixtures/scenarios/*.json; do
	suite=$(basename "$fixture" .json)
	# authored.json is ours, not upstream's, and has a Recorder of its own.
	[ "$suite" = authored ] || node scripts/harvest-scenarios.mjs "$suite"
done
node scripts/harvest-authored.mjs
node scripts/harvest-static.mjs
node scripts/harvest-scripted.mjs
node scripts/harvest-emitter.mjs
node scripts/harvest-limit-options.mjs
node scripts/harvest-line-editor.mjs
node scripts/harvest-width.mjs
node scripts/harvest-wrap.mjs
# --porcelain rather than `git diff`, so a Fixture that was recorded but never committed counts.
if [ -z "$(git status --porcelain -- $fixtures)" ]; then
	echo "drift: none. Every Fixture is what pinned clack produces today."
else
	git status --short -- $fixtures >&2
	echo "drift: the Fixtures above no longer match pinned clack. Read the diff before keeping it." >&2
	exit 1
fi
'''
