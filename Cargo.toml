[workspace]
members = ["clackatui", "clackatui-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/idleberg/clackatui"
rust-version = "1.85"

[workspace.dependencies]
# Pinned exactly: pre-1.0, expect churn. See docs/adr/0006.
ratatui-core = "=0.1.2"

# Unicode property tables for the width port. Pinned exactly because a table bump is a silent
# behaviour change: these decide where clack's regexes match, so a new Unicode version can move a
# measurement without moving a line of our code. See docs/adr/0005 and docs/adr/0008.
unicode-properties = "=0.1.4"
unicode-script = "=0.5.8"

# NFC, because `wrapAnsi` normalises the Frame before it wraps it and clack writes the result. Not
# pinned exactly: composition is stable by Unicode policy — the exclusion list does not move — so a
# table bump cannot change an answer the way it can for the width tables above.
unicode-normalization = "0.1.25"

# Terminal I/O for the driver in `clackatui`. Not pinned exactly: it is not part of any parity
# claim — what it decides is which key events arrive, and that is checked against readline rather
# than against a crossterm version.
crossterm = "0.29"

# Tests only, for reading harvested Fixtures. Not pinned: it is not part of any parity claim.
serde_json = "1.0.151"

# Tests only: the terminal emulator both byte streams are replayed through, so that the comparison
# is between two Grids rather than between two encodings of one appearance. See docs/adr/0015 for
# why it is this emulator and not `vt100`. Not pinned exactly, but it is the arbiter of every
# appearance claim in the project, so a bump is read rather than taken.
avt = "0.18.0"
