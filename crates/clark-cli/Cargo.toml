[package]
name = "clark-cli"
version = "0.2.0"
description = "CLI for clark, the Rust port of Bombshell's clack prompts."
keywords = ["clack", "terminal", "prompt", "dialogs", "shell"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**/*.rs", "README.md", "LICENSE", "NOTICE"]

[[bin]]
name = "clark"
path = "src/main.rs"

[dependencies]
clark = { path = "../clark", version = "0.2.0" }
clap.workspace = true
